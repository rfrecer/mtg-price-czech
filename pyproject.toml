[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-price-czech"
dynamic = ["version"]
description = "Async fetchers for Magic: The Gathering single-card prices from Najada and Černý Rytíř."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Robert Frecer" },
]
keywords = ["mtg", "magic-the-gathering", "czech", "prices", "najada", "cernyrytir"]
dependencies = [
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
]

[project.urls]
Homepage = "https://github.com/rfrecer/mtg-price-czech"
Repository = "https://github.com/rfrecer/mtg-price-czech"

[tool.hatch.version]
path = "src/mtg_price_czech/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
